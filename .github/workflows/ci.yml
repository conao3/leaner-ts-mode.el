name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '30.1'
          - '30.2'
          - '31.1'
          - 'snapshot'
        include:
          - emacs_version: 'snapshot'
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure == true }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - name: Install keg
        run: |
          git clone --depth 1 https://github.com/conao3/keg.el.git "$HOME/.keg"
          echo "$HOME/.keg/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Lean grammar
        run: emacs -Q --batch -L . -l leaner-ts-mode.el -f leaner-ts-install-grammar

      - name: Run checks
        run: make check
