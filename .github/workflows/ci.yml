name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '30.1'
          - '30.2'
          - '31.1'
          - 'snapshot'
        include:
          - emacs_version: 'snapshot'
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure == true }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}
      - name: Install keg
        run: |
          git clone --depth 1 https://github.com/conao3/keg.el.git "$HOME/.keg"
          echo "$HOME/.keg/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Lean grammar
        run: emacs -Q --batch -L . -l leaner-ts-mode.el -f leaner-ts-install-grammar

      - uses: leanprover/lean-action@v1.7.1
        with:
          lake-package-directory: test/fixtures/lsp
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Select the test toolchain
        run: elan default "$(cat test/fixtures/lsp/lean-toolchain)"

      - name: Ensure Eglot 1.20 or newer for integration tests
        run: |
          keg exec emacs --batch --eval "(progn (require 'package) (require 'eglot) (unless (fboundp 'eglot-semantic-tokens-mode) (package-refresh-contents) (package-install (car (alist-get 'eglot package-archive-contents)))))"

      - name: Run checks
        run: make check
